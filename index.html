<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let’s Go to the Field! – English Grade 5</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfeefd;--ink:#2a2350;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10152e}}
:root[data-theme="dark"]{--bg:#10152e}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;color:var(--ink)}
#st{position:absolute;left:50%;top:50%;width:1123px;height:794px;transform-origin:center;border-radius:36px;overflow:hidden;background:linear-gradient(#8fd8ff,#e6f8ff 55%,#b6ec8a 55%,#5cc450);box-shadow:0 20px 40px #0005,0 0 0 8px #fff}
.pg{position:absolute;inset:0;padding:34px 48px 84px;display:none;animation:in .5s}
.pg.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97)}}
h1,h2{margin:0}
h2{display:inline-block;font-size:38px;color:#fff;padding:6px 30px;border-radius:40px;background:linear-gradient(#ff9a3c,#ff6a00);box-shadow:0 6px 0 #b84a00,0 12px 18px #0003,inset 0 3px 0 #ffd2a0;text-shadow:0 3px 0 #b84a00}
.card{background:linear-gradient(#fff,#f1f8ff);border-radius:28px;box-shadow:0 8px 0 #9cc4e8,0 16px 24px #0003,inset 0 3px 0 #fff;padding:18px 24px}
.btn{font:700 22px 'Fredoka',sans-serif;color:#fff;border:0;border-radius:30px;padding:10px 28px;cursor:pointer;background:linear-gradient(#58d86a,#22a83a);box-shadow:0 6px 0 #167a28,0 10px 14px #0003,inset 0 3px 0 #a8f5b4;transition:.12s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #167a28}
.btn.b{background:linear-gradient(#4db8ff,#1478e0);box-shadow:0 6px 0 #0c53a0,0 10px 14px #0003,inset 0 3px 0 #a8dcff}
.btn.s{font-size:16px;padding:4px 16px}
.cover{text-align:center;padding-top:50px}
.cover h1{font-size:96px;line-height:1;color:#ffd23c;-webkit-text-stroke:4px #b8430a;paint-order:stroke fill;text-shadow:0 8px 0 #b8430a,0 18px 22px #0006;transform:perspective(600px) rotateX(10deg)}
.cover p{font-size:30px;font-weight:600;margin:20px 0 26px;color:#fff;text-shadow:0 3px 0 #1a6db0}
.fl{position:absolute;font-size:120px;filter:drop-shadow(0 16px 10px #0005);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-22px) rotate(6deg)}}
.g{display:grid;gap:16px}
.fc{perspective:700px;cursor:pointer;height:190px}
.in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fc.f .in{transform:rotateY(180deg)}
.ft,.bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 0 #0003,0 14px 18px #0003,inset 0 4px 0 #fff8}
.ft{background:linear-gradient(#fff,#d9efff)}
.ft b{font-size:68px;filter:drop-shadow(0 8px 5px #0004)}
.ft span{font-size:28px;font-weight:700}
.bk{background:linear-gradient(#ffb347,#ff7a18);color:#fff;font-size:32px;font-weight:700;transform:rotateY(180deg);text-shadow:0 3px 0 #b84a00}
.act .fc{height:170px}
.sent{display:flex;align-items:center;justify-content:space-between;margin:9px 0;padding:10px 22px;font-size:24px}
.sent small{display:block;font-size:18px;color:#5a6a95}
.bub{max-width:430px;padding:12px 20px;margin:12px 0;border-radius:26px;font-size:24px;font-weight:600;box-shadow:0 6px 0 #0003,inset 0 3px 0 #fff6}
.al{background:linear-gradient(#ff9ec8,#ff5ca0);color:#fff}
.rk{background:linear-gradient(#7fc8ff,#3a8fef);color:#fff;margin-left:auto}
.ac{display:flex;gap:16px;align-items:center;margin:13px 0;font-size:23px}
.ac em{font-style:normal;font-size:50px}
.ac b{display:block;font-size:26px;color:#e0530a}
input,select{font:600 20px 'Fredoka',sans-serif;border:3px solid #9cc4e8;border-radius:14px;padding:3px 8px;background:#fff;color:#2a2350}
input{width:130px}input.c{width:44px;text-align:center}
.ok{border-color:#22a83a!important;background:#d8ffdf!important}.no{border-color:#e03030!important;background:#ffdcdc!important}
.pr h3{margin:4px 0 6px;font-size:21px;color:#1478e0}.pr p{margin:4px 0;font-size:20px}
.q{margin:7px 0;padding:10px 18px}
.q p{margin:0 0 6px;font-size:21px;font-weight:700}
.o{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.o button{font:600 19px 'Fredoka',sans-serif;text-align:left;padding:6px 14px;border-radius:16px;border:3px solid #b9d6f0;background:#fff;cursor:pointer;color:#2a2350;box-shadow:0 4px 0 #b9d6f0}
.o button:hover{background:#eaf6ff}
.o .r{background:#c9f7d2;border-color:#22a83a;box-shadow:0 4px 0 #22a83a}.o .w{background:#ffd5d5;border-color:#e03030;box-shadow:0 4px 0 #e03030}
.sc{font-size:150px;font-weight:700;color:#ff7a18;text-shadow:0 8px 0 #b84a00,0 16px 20px #0004;transform:perspective(500px) rotateX(12deg)}
#nav{position:absolute;left:0;right:0;bottom:0;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:linear-gradient(#3a8fef,#1f5fc0);box-shadow:inset 0 4px 0 #fff4}
#dots{display:flex;gap:8px}#dots i{width:14px;height:14px;border-radius:50%;background:#fff5;box-shadow:inset 0 2px 0 #fff6}#dots i.on{background:#ffd23c;transform:scale(1.3)}
#tip{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);font-size:30px;font-weight:700;color:#fff;background:#e0530a;padding:6px 30px;border-radius:30px;box-shadow:0 6px 0 #8a2e00;display:none}
.it{position:absolute;font-size:90px;cursor:pointer;filter:drop-shadow(0 14px 8px #0004);transition:.2s}.it:hover{transform:scale(1.2) rotate(-6deg)}
/* Realistic style */
body,.btn,input,select,.o button{font-family:'Inter','Segoe UI',Arial,sans-serif}
#st{font-family:'Inter','Segoe UI',Arial,sans-serif;box-shadow:0 24px 50px #0006;background:linear-gradient(rgba(255,255,255,.14),rgba(0,0,0,.28)) 0 100%/100% 48% no-repeat,repeating-linear-gradient(90deg,#4f9a3c 0 70px,#468e35 70px 140px) 0 100%/100% 48% no-repeat,linear-gradient(#2e5d36,#3f7d3f) 0 49%/100% 6% no-repeat,radial-gradient(ellipse 160px 40px at 20% 18%,#fff 0,#fff0 70%),radial-gradient(ellipse 220px 50px at 70% 12%,#fffe 0,#fff0 70%),radial-gradient(ellipse 140px 34px at 90% 30%,#fffc 0,#fff0 70%),linear-gradient(#5aa7e0,#cfe8f7 46%)}
h2{background:rgba(16,42,67,.92);border-radius:14px;padding:8px 26px;font-size:32px;font-weight:700;text-shadow:none;box-shadow:0 6px 18px #0004;border-left:8px solid #f5b301}
.card{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:16px;box-shadow:0 10px 30px #0003;border:1px solid #fff9}
.btn{background:#1b7f4b;border-radius:12px;box-shadow:0 4px 12px #0004;font-weight:600;font-size:20px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 4px #0004}
.btn.b{background:#1f5fa8}.btn.s{font-size:15px}
.cover h1{color:#fff;-webkit-text-stroke:0;text-shadow:0 4px 24px #000a;transform:none;font-weight:800;letter-spacing:-2px}
.cover p{text-shadow:0 2px 10px #0008}
.fl{filter:drop-shadow(0 22px 14px #0006)}
.ft,.bk{border-radius:16px;box-shadow:0 10px 24px #0004}
.ft{background:#fff}.ft b{filter:drop-shadow(0 6px 6px #0004)}
.bk{background:linear-gradient(#1b7f4b,#115c35);text-shadow:none;font-weight:600}
.bub{box-shadow:0 3px 10px #0003}.al{background:#e8e8ed;color:#222}.rk{background:#1f8bff}
.ac b{color:#1b7f4b}.pr h3{color:#1f5fa8}
.o button{border-radius:10px;border:2px solid #cbd5e1;box-shadow:none}.o .r,.o .w{box-shadow:none}
.sc{color:#fff;text-shadow:0 6px 24px #000a;transform:none;font-weight:800}
#nav{background:rgba(16,42,67,.95);box-shadow:none}#dots i{box-shadow:none}#dots i.on{background:#f5b301}
#tip{background:rgba(16,42,67,.95);box-shadow:0 6px 18px #0005;border-radius:12px}
.it{filter:drop-shadow(0 16px 10px #0006)}
.fs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:50;width:46px;height:46px;border:0;border-radius:12px;font-size:26px;line-height:1;cursor:pointer;color:#fff;background:rgba(16,42,67,.9);box-shadow:0 4px 12px #0006}.fs:hover{background:#1b7f4b}
.o{grid-template-columns:repeat(4,1fr)}.o button{font-size:17px;padding:6px 10px}.q{margin:8px 0}
#tip{bottom:84px;z-index:5}
.pr input:not(.c){width:104px}.pr input.c{width:48px}
</style></head><body>
<div id="st"></div><button class="fs" id="fs" title="Layar penuh" aria-label="Layar penuh" onclick="tfs()">⛶</button>
<script>
const $=s=>document.querySelector(s),st=$('#st');
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
const V=[["Field","Lapangan","🏟️"],["Ball","Bola","⚽"],["Goal","Gawang","🥅"],["Net","Jaring","🕸️"],["Whistle","Peluit","📢"],["Team","Tim","👥"],["Player","Pemain","🏃"],["Coach","Pelatih","🧑‍🏫"],["Running track","Lintasan lari","🛣️"],["Sports shoes","Sepatu olahraga","👟"]];
const A=[["Run","Berlari","🏃"],["Walk","Berjalan","🚶"],["Jump","Melompat","🤸"],["Kick","Menendang","🦵"],["Throw","Melempar","🤾"],["Catch","Menangkap","🧤"],["Play","Bermain","🎉"],["Exercise","Berolahraga","🏋️"]];
const S=[["Let’s go to the field!","Ayo pergi ke lapangan!"],["I can see a ball.","Saya dapat melihat sebuah bola."],["I play football on the field.","Saya bermain sepak bola di lapangan."],["We run and jump.","Kami berlari dan melompat."],["The coach has a whistle.","Pelatih memiliki peluit."]];
const Q=[["What is the Indonesian meaning of “field”?",["Lapangan","Perpustakaan","Kantin","Ruang kelas"],0],["We play football with a ....",["ruler","ball","book","pencil"],1],["What is the English word for “berlari”?",["Jump","Walk","Sit","Run"],3],["The students play football on the ....",["classroom","library","field","canteen"],2],["What is the Indonesian meaning of “goalpost”?",["Tiang gawang","Bangku","Pohon","Bendera"],0],["Choose the correct English word for “melompat”.",["Kick","Jump","Throw","Catch"],1],["“I can see a tree.” The word “tree” means ....",["rumput","bola","pohon","lapangan"],2],["Which sentence means “Saya bermain di lapangan”?",["I read in the library.","I eat in the canteen.","I sit in the classroom.","I play on the field."],3],["What do we use to play badminton?",["Racket","Football","Goalpost","Whistle"],0],["Choose the correct spelling for “lapangan” in English.",["Feeld","Field","Fild","Fielt"],1]];
const fc=a=>`<div class="fc" onclick="this.classList.toggle('f');say('${a[0]}')"><div class="in"><div class="ft"><b>${a[2]}</b><span>${a[0]}</span></div><div class="bk">${a[1]}</div></div></div>`;
const qh=(a,b)=>a.slice(b,b+5).map((q,k)=>{const i=b+k;return `<div class="card q"><p>${i+1}. ${q[0]}</p><div class="o">${q[1].map((o,j)=>`<button onclick="pick(${i},${j},this)">${'ABCD'[j]}. ${o}</button>`).join('')}</div></div>`}).join('');
const items=[["⚽","Ball","Bola",120,470],["🥅","Goal","Gawang",760,300],["🧑‍🏫","Coach","Pelatih",600,470],["🏃","Player","Pemain",330,430],["🌳","Tree","Pohon",930,420],["👟","Sports shoes","Sepatu olahraga",470,520],["🛣️","Running track","Lintasan lari",800,520]];
const P=[
`<div class="cover"><div class="fl" style="left:70px;top:90px">⚽</div><div class="fl" style="right:80px;top:70px;animation-delay:.6s">🏃‍♀️</div><div class="fl" style="left:120px;top:470px;animation-delay:1s">🥅</div><div class="fl" style="right:110px;top:450px;animation-delay:1.5s">🧑‍🏫</div><h1>Let’s Go to<br>the Field!</h1><p>English Grade 5 • Ayo Pergi ke Lapangan!</p><button class="btn" onclick="go(1)">▶ Mulai Belajar</button></div>`,
`<h2>🎯 Tujuan &amp; Let’s Observe!</h2><div class="card" style="margin:14px 0;font-size:21px"><b>Tujuan:</b> menyebutkan dan menuliskan kosakata sederhana tentang “Let’s Go to the Field!” melalui mengamati, menirukan, dan menulis.<br><b>Imagine you are at the school field. What can you see? What activities can you do?</b><br><small style="font-size:17px">Bayangkan kamu berada di lapangan sekolah. Apa yang kamu lihat dan kegiatan apa yang dapat kamu lakukan? Ketuk benda-benda di bawah!</small></div>${items.map(i=>`<div class="it" style="left:${i[3]}px;top:${i[4]}px;font-size:${i[3]==120?70:90}px" onclick="tip('${i[1]}','${i[2]}')">${i[0]}</div>`).join('')}<div id="tip"></div>`,
`<h2>📚 Vocabulary: At the Field</h2><p style="margin:6px 0 14px;font-size:20px;font-weight:600">Ketuk kartu untuk melihat arti &amp; mendengar suara!</p><div class="g" style="grid-template-columns:repeat(5,1fr);margin-top:6px">${V.map(fc).join('')}</div>`,
`<h2>⚡ Action Words</h2><p style="margin:6px 0 14px;font-size:20px;font-weight:600">Ketuk kartu, lalu peragakan geraknya!</p><div class="g act" style="grid-template-columns:repeat(4,1fr)">${A.map(fc).join('')}</div>`,
`<h2>💬 Useful Sentences</h2><div style="margin-top:12px">${S.map(s=>`<div class="card sent"><div>${s[0]}<small>${s[1]}</small></div><button class="btn b s" onclick="say('${s[0]}')">🔊 Listen</button></div>`).join('')}</div>`,
`<h2>🗣️ Short Dialogue</h2><div class="card" style="margin-top:16px;padding:20px 30px"><div class="bub al">👧 Alya: Let’s go to the field!</div><div class="bub rk">👦 Raka: Great! What can you see?</div><div class="bub al">👧 Alya: I can see a ball and a goal.</div><div class="bub rk">👦 Raka: Let’s play!</div><div style="text-align:center;margin-top:8px"><button class="btn" onclick="say('Alya: Let’s go to the field! Raka: Great! What can you see? Alya: I can see a ball and a goal. Raka: Let’s play!')">🔊 Dengarkan Dialog</button></div></div>`,
`<h2>🎮 Learning Activities</h2><div class="card" style="margin-top:16px;padding:14px 30px"><div class="ac"><em>🎧</em><div><b>1. Listen and Repeat</b>Dengarkan guru, lalu tirukan pengucapan setiap kosakata.</div></div><div class="ac"><em>👆</em><div><b>2. Point and Say</b>Tunjuk gambar atau benda di lapangan dan sebutkan namanya dalam bahasa Inggris.</div></div><div class="ac"><em>🎭</em><div><b>3. Act and Guess</b>Peragakan run, jump, kick, atau throw; teman menebak kata kerjanya.</div></div><div class="ac"><em>✏️</em><div><b>4. Look and Write</b>Amati lingkungan lapangan sekolah, lalu tuliskan lima kosakata yang ditemukan.</div></div></div>`,
`<h2>✏️ Let’s Practice!</h2><div class="card pr" style="margin-top:12px;padding:10px 24px"><h3>1. Match the words with the meanings.</h3><p>Ball → ${sel('Bola')} &nbsp; Field → ${sel('Lapangan')} &nbsp; Jump → ${sel('Melompat')}</p><h3>2. Complete the words.</h3><p>B <input class="c" data-a="a" maxlength="1"> L L &nbsp; F I <input class="c" data-a="e" maxlength="1"> L D &nbsp; R <input class="c" data-a="u" maxlength="1"> N &nbsp; G O <input class="c" data-a="a" maxlength="1"> L</p><h3>3. Write the English words.</h3><p>Peluit: <input data-a="whistle"> Menendang: <input data-a="kick"> Tim: <input data-a="team"> Menangkap: <input data-a="catch"></p><h3>4. Write two simple sentences using the vocabulary above.</h3><p><input style="width:100%;box-sizing:border-box" placeholder="a. ..."></p><p><input style="width:100%;box-sizing:border-box" placeholder="b. ..."></p><div style="text-align:center;margin-top:6px"><button class="btn b" onclick="chk()">✔ Periksa Jawaban</button> <span id="cm" style="font-size:22px;font-weight:700"></span></div></div>`,
`<h2>🏆 Soal Pilihan Ganda (1–5)</h2><div style="margin-top:8px">${qh(Q,0)}</div>`,
`<h2>🏆 Soal Pilihan Ganda (6–10)</h2><div style="margin-top:8px">${qh(Q,5)}</div>`,
`<div class="cover"><h1 style="font-size:64px">Hasil Kamu!</h1><div class="sc" id="sc">0</div><p id="sm"></p><button class="btn" onclick="rs()">🔄 Ulangi Soal</button> <button class="btn b" onclick="go(0)">🏠 Ke Awal</button></div>`];
function sel(r){return `<select data-a="${r.toLowerCase()}"><option value="">?</option><option>Bola</option><option>Lapangan</option><option>Melompat</option></select>`}
st.innerHTML=P.map((h,i)=>`<section class="pg">${h}</section>`).join('')+`<div id="nav"><button class="btn s" onclick="go(n-1)">◀ Kembali</button><div id="dots">${P.map(()=>'<i></i>').join('')}</div><button class="btn s" onclick="go(n+1)">Lanjut ▶</button></div>`;
let n=0,ans={};const pg=[...document.querySelectorAll('.pg')],dt=[...document.querySelectorAll('#dots i')];
function go(k){n=Math.max(0,Math.min(P.length-1,k));pg.forEach((p,i)=>p.classList.toggle('on',i==n));dt.forEach((d,i)=>d.classList.toggle('on',i==n));if(n==P.length-1)fin()}
function tip(e,id){const t=$('#tip');t.style.display='block';t.textContent=e+' = '+id;say(e)}
function pick(i,j,b){if(i in ans)return;ans[i]=j;const bs=b.parentNode.children;bs[Q[i][2]].classList.add('r');if(j!=Q[i][2])b.classList.add('w')}
function chk(){let ok=0,t=0;document.querySelectorAll('.pr [data-a]').forEach(e=>{t++;const g=(e.value||'').trim().toLowerCase(),r=g==e.dataset.a;e.classList.toggle('ok',r);e.classList.toggle('no',!r);if(r)ok++});$('#cm').textContent=`Benar ${ok} dari ${t} ${ok==t?'🎉 Hebat!':'– coba lagi ya!'}`}
function fin(){let s=0;Q.forEach((q,i)=>{if(ans[i]==q[2])s+=10});$('#sc').textContent=s;$('#sm').textContent=s>=80?'🌟 Luar biasa! Kamu jagoan lapangan!':s>=60?'👍 Bagus! Terus berlatih ya!':'💪 Ayo belajar lagi, kamu pasti bisa!'}
function rs(){ans={};document.querySelectorAll('.o button').forEach(b=>b.classList.remove('r','w'));go(8)}
function tfs(){const d=document,e=d.documentElement,on=d.fullscreenElement||d.webkitFullscreenElement;try{if(on){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}}catch(x){}}
['fullscreenchange','webkitfullscreenchange'].forEach(v=>d_=document.addEventListener(v,()=>{const on=document.fullscreenElement||document.webkitFullscreenElement;$('#fs').textContent=on?'✕':'⛶';$('#fs').title=on?'Keluar layar penuh':'Layar penuh';fit()}));
function fit(){st.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1140,innerHeight/810)})`}
addEventListener('resize',fit);addEventListener('keydown',e=>{if(e.target.tagName!='INPUT'){if(e.key=='ArrowRight')go(n+1);if(e.key=='ArrowLeft')go(n-1)}});fit();go(0);
</script></body></html>
